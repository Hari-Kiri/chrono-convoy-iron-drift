plugins {
    id 'java-library'
    id 'application'
}

group = 'com.chronoconvoy'
version = '1.0.0'

ext {
    gdxVersion = '1.12.1'
    junitVersion = '5.10.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDirs = ['assets']
        }
    }
}

dependencies {
    api "com.badlogicgames.gdx:gdx:${gdxVersion}"
    api "com.badlogicgames.gdx:gdx-box2d:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:${gdxVersion}"
    implementation "com.badlogicgames.gdx:gdx-backend-headless:${gdxVersion}"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:${gdxVersion}:natives-desktop"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-box2d-platform:${gdxVersion}:natives-desktop"
}

application {
    mainClass = 'com.chronoconvoy.client.DesktopLauncher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    systemProperty 'java.awt.headless', 'true'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Packages the standalone desktop LWJGL3 + Headless playable release JAR with all assets and natives.'
    archiveBaseName.set('chrono-convoy-desktop')
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('')
    archiveFileName.set("chrono-convoy-desktop-${project.version}.jar")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
            'Main-Class': 'com.chronoconvoy.client.DesktopLauncher',
            'Implementation-Title': 'Chrono-Convoy: Iron Drift Client',
            'Implementation-Version': project.version.toString()
        )
    }

    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    } {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    }
}

tasks.register('dist') {
    group = 'distribution'
    description = 'Builds the standalone executable Fat JAR distribution.'
    dependsOn tasks.named('fatJar')
}
